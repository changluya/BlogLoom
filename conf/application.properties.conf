# BlogLoom external configuration template.
# Copy this file to application.properties and replace the placeholder values.
# 支持通过环境变量覆盖，未设置时使用冒号后的默认值。

# Service
server.port=8090
blog.name=${BLOG_NAME:Changlu's Blog}
blog.api=${BLOG_API:http://localhost:8090}
blog.cms=${BLOG_CMS:http://localhost:8080}
blog.view=${BLOG_VIEW:http://localhost:8081}

# Multipart uploads (knowledge-base ZIP supports files up to 500 MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blogloom}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

# Cache
# Redis has been replaced by the MySQL cache_entry table; no external cache service is required.

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Login token
token.expireTime=259200000
token.secretKey=${TOKEN_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET}

# Comment notification
comment.notify.channel=${COMMENT_NOTIFY_CHANNEL:mail}
comment.default-open=true

# Mail (required when comment.notify.channel=mail)
spring.mail.host=${MAIL_HOST:smtp.mxhichina.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:CHANGE_ME}
spring.mail.password=${MAIL_PASSWORD:CHANGE_ME}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.ssl.enable=true

# Telegram (required only when comment.notify.channel=tg)
tg.bot.api=https://api.telegram.org/bot
tg.bot.token=${TG_BOT_TOKEN:}
tg.bot.chat-id=${TG_BOT_CHAT_ID:}
tg.bot.use-proxy=false
tg.bot.use-reverse-proxy=false
tg.bot.reverse-proxy-url=

# HTTP proxy used by Telegram when tg.bot.use-proxy=true
http.proxy.server.host=127.0.0.1
http.proxy.server.port=7890
http.proxy.server.timeout=10000

# Logging
logging.level.root=info
logging.level.com.changlu.blogloom=info
logging.file=${user.dir.conf}/logs/blogloom
