# BlogLoom external configuration.

# Service
server.port=8090
blog.name=Changlu's Blog
blog.api=http://localhost:${server.port}
blog.cms=http://localhost:8080
blog.view=http://localhost:8081

# Multipart uploads (knowledge-base ZIP supports files up to 500 MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/blogloom?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# Redis
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=123456
spring.redis.database=0
spring.redis.timeout=10000ms

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Login token
token.expireTime=259200000
token.secretKey=replace-with-a-long-random-secret

# Comment notification
comment.notify.channel=mail
comment.default-open=true

# Mail (required when comment.notify.channel=mail)
spring.mail.host=smtp.mxhichina.com
spring.mail.port=465
spring.mail.username=admin@example.com
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

# Telegram (required only when comment.notify.channel=tg)
tg.bot.api=https://api.telegram.org/bot
tg.bot.token=
tg.bot.chat-id=
tg.bot.use-proxy=false
tg.bot.use-reverse-proxy=false
tg.bot.reverse-proxy-url=

# HTTP proxy used by Telegram when tg.bot.use-proxy=true
http.proxy.server.host=127.0.0.1
http.proxy.server.port=7890
http.proxy.server.timeout=10000

# Mail (used when comment.notify.channel=mail)
spring.mail.host=smtp.mxhichina.com
spring.mail.port=465
spring.mail.username=admin@example.com
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

# Local uploads
upload.channel=local

# Logging
logging.level.root=info
logging.level.com.changlu.blogloom=info
logging.file=${user.dir.conf}/logs/blogloom
