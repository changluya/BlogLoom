# 单元测试专用配置：使用 H2 内存库替代 MySQL，避免依赖外部服务。
# 应用启动时会访问 cache_entry / schedule_job / blog 表，schema.sql 通过 H2 INIT 预先建表。
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:blogloom;MODE=MySQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
spring.datasource.username=sa
spring.datasource.password=

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 登录 token
token.expireTime=259200000
token.secretKey=blogloom-test-secret-key

# 评论通知
comment.notify.channel=mail
comment.default-open=true

# 邮件（仅用于让 JavaMailSender 自动装配成功）
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test

# 站点地址
blog.name=BlogLoom Test
blog.api=http://localhost:8090
blog.cms=http://localhost:8080
blog.view=http://localhost:8081

# Quartz 使用内存存储
spring.quartz.job-store-type=memory

# 降低测试期日志噪音
logging.level.root=warn
logging.level.com.changlu.blogloom=warn
