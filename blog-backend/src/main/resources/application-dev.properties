# ==================== 服务基础配置 ====================
# 后端服务监听端口
server.port=8090
# 网站名称
blog.name=Changlu's Blog
# 以下地址用于生成跨端链接；部署生产环境时请替换为实际域名
# 后端 API 地址（生产示例：https://api.changlu.top/blog）
blog.api=http://localhost:${server.port}
# 后台管理端地址（生产示例：https://admin.changlu.top）
blog.cms=http://localhost:8080
# 博客前台地址（生产示例：https://changlu.top）
blog.view=http://localhost:8081

# ==================== MySQL ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/blogloom?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# ==================== Redis ====================
spring.redis.host=127.0.0.1
spring.redis.password=123456
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=10000ms

# ==================== MyBatis ====================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== 日志 ====================
logging.level.root=info
logging.level.com.changlu.blogloom=debug
logging.file=blog-backend/log/blog-dev

# ==================== 登录令牌 ====================
# Token 有效期，单位为毫秒；当前为 3 天
token.expireTime=259200000
# 生产环境必须替换为足够复杂且不可公开的随机字符串
token.secretKey=abcdefghijklmnopqrstuvwxyz

# ==================== 评论通知 ====================
# 博主通知渠道：mail（邮箱）或 tg（Telegram）；访客回复提醒固定使用邮箱
comment.notify.channel=mail
# 新评论是否默认公开：true 为公开，false 为待审核
comment.default-open=true

# ==================== 邮件服务 ====================
# mail 模式下用于通知博主；tg 模式下仍作为访客回复提醒的发件邮箱
# 当前为阿里云邮箱示例，使用其他服务商时请同步调整 SMTP 地址与端口
spring.mail.host=smtp.mxhichina.com
spring.mail.port=465
spring.mail.username=admin@example.com
spring.mail.password=123456
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

# ==================== Telegram ====================
# comment.notify.channel=mail 时，以下 Telegram 配置不会用于博主通知
tg.bot.api=https://api.telegram.org/bot
# Bot Token，可通过 @BotFather 获取
tg.bot.token=1234567890:qwertyuiopasdfghjklzxcvbnm
# 博主账号与 Bot 的聊天会话 ID
tg.bot.chat-id=1234567890
# 是否使用本地 HTTP 代理
tg.bot.use-proxy=false
# 是否使用 Telegram API 反向代理
tg.bot.use-reverse-proxy=true
# 反向代理地址，请使用自己维护的可靠服务
tg.bot.reverse-proxy-url=https://tg-api-open.changlu.workers.dev

# ==================== HTTP 代理 ====================
# 目前仅用于发送 Telegram 请求；未启用代理时无需调整
http.proxy.server.host=127.0.0.1
http.proxy.server.port=7890
http.proxy.server.timeout=10000

# ==================== 图片上传 ====================
# 评论头像存储渠道：local（本地）、github（GitHub）或 upyun（又拍云）
upload.channel=local

# 本地上传目录。Windows 示例：C:/BlogLoom/upload/；Linux 示例：/opt/blogloom/upload/
upload.file.path=/Users/changlu/Desktop/upload/
# 静态资源访问路径
upload.file.access-path=/image/**
# Spring 静态资源映射位置
upload.file.resources-locations=file:${upload.file.path}

# ==================== GitHub 图床 ====================
# 仅 upload.channel=github 时生效；Token 不要提交到公开仓库
upload.github.token=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
upload.github.username=changlu
# 用作图床的仓库名
upload.github.repos=test
# 仓库内上传目录：以“/”开头，末尾不要带“/”
upload.github.repos-path=/comment/avatar

# ==================== 又拍云图床 ====================
# 仅 upload.channel=upyun 时生效
# 存储空间名称
upload.upyun.bucket-name=nblog
# 操作员名称
upload.upyun.username=changlu
# 操作员密码
upload.upyun.password=xxxxxxxxxxxxxxxxxxxxxxxxxxxx
# 云端存储目录
upload.upyun.path=/comment/avatar
# CDN 访问域名
upload.upyun.domain=https://cdn.example.com
