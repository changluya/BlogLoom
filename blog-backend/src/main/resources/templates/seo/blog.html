<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="seo/fragments/seo-head :: head(${seo})"></head>
<body>
<div class="site blog-site">
<div class="home-hero-background m-mobile-hide" th:style="${'background-image:url(''' + (layout.siteInfo['heroConfig'] != null and layout.siteInfo['heroConfig']['backgroundImage'] != null ? layout.siteInfo['heroConfig']['backgroundImage'] : '/img/banner/home-banner.png') + ''')'}" aria-hidden="true"></div>
<nav class="ui fixed inverted stackable pointing menu seo-original-nav" aria-label="主导航"><div class="ui container">
	<a href="/"><h3 class="ui header item m-blue" th:text="${layout.siteInfo['blogName'] ?: seo.siteName}">BlogLoom</h3></a>
	<a href="/" class="item"><i class="home icon"></i>首页</a><a href="/archives" class="item"><i class="clone icon"></i>归档</a><a href="/moments" class="item"><i class="comment alternate outline icon"></i>动态</a><a href="/friends" class="item"><i class="users icon"></i>友人帐</a><a href="/about" class="item"><i class="info icon"></i>关于我</a>
	<a class="right item" href="/search"><i class="search icon"></i>搜索文章...</a>
</div></nav>
<main class="main"><div class="m-padded-tb-big"><div class="ui container"><div class="ui stackable grid">
	<aside class="three wide column m-mobile-hide" aria-label="站点信息">
		<div class="ui segments m-box introduction-shell"><div class="ui card introduction-card">
			<div class="introduction-cover" th:style="${'background-image:url(''' + (layout.siteInfo['heroConfig'] != null and layout.siteInfo['heroConfig']['backgroundImage'] != null ? layout.siteInfo['heroConfig']['backgroundImage'] : '/img/banner/home-banner.png') + ''')'}"></div>
			<a href="/home" class="image introduction-avatar" th:if="${layout.introduction.avatar != null and !layout.introduction.avatar.isEmpty()}"><img th:src="${layout.introduction.avatar}" alt="返回首页"></a>
			<div class="content" align="center"><div class="header" th:text="${layout.introduction.name ?: seo.siteName}">博主</div><div class="introduction-role"><i class="code icon"></i><span th:text="${layout.introduction.profileLabel ?: 'Java 开发者'}"></span></div><div class="blog-statistics"><span><strong th:text="${layout.totalViews}">0</strong><em>总访问量</em></span><span><strong th:text="${layout.publishedBlogCount}">0</strong><em>原创</em></span><span><strong th:text="${layout.totalBlogViews}">0</strong><em>总阅读量</em></span></div><div class="signature m-margin-top" th:if="${!layout.introduction.rollText.isEmpty()}"><p class="signature-line" th:each="line : ${layout.introduction.rollText}" th:text="${line}"></p></div></div>
			<div class="extra content" align="center"><a class="ui circular icon button" title="GitHub" th:if="${layout.introduction.github != null}" th:href="${layout.introduction.github}" rel="nofollow noopener"><i class="github icon"></i></a><a class="ui circular icon button csdn-button" title="CSDN" th:if="${layout.introduction.csdn != null}" th:href="${layout.introduction.csdn}" rel="nofollow noopener"><img class="csdn-icon" src="/img/csdn-logo.svg" alt="CSDN"></a><a class="ui circular icon button" title="Telegram" th:if="${layout.introduction.telegram != null}" th:href="${layout.introduction.telegram}" rel="nofollow noopener"><i class="telegram plane icon"></i></a><a class="ui circular icon button" title="QQ" th:if="${layout.introduction.qq != null}" th:href="${layout.introduction.qq}" rel="nofollow noopener"><i class="qq icon"></i></a><a class="ui circular icon button" title="bilibili" th:if="${layout.introduction.bilibili != null}" th:href="${layout.introduction.bilibili}" rel="nofollow noopener"><i class="tv icon"></i></a><a class="ui circular icon button" title="网易云音乐" th:if="${layout.introduction.netease != null}" th:href="${layout.introduction.netease}" rel="nofollow noopener"><i class="music icon"></i></a><a class="ui circular icon button" title="邮箱" th:if="${layout.introduction.email != null}" th:href="${layout.introduction.email}" rel="nofollow"><i class="envelope icon"></i></a></div>
		</div></div>
		<div class="ui segments m-box" th:if="${!layout.columns.isEmpty()}"><div class="ui secondary segment sidebar-title"><img src="/img/sidebar/columns.svg" class="sidebar-title-icon" alt=""><span>TA 的专栏</span></div><div class="ui segment column-panel"><div class="column-tree"><div class="column-group" th:each="column : ${layout.columns}"><a class="column-row root-row" th:href="@{'/column/' + ${column.id}}"><span class="root-branch" aria-hidden="true"></span><img th:if="${column.cover != null and !column.cover.isEmpty()}" th:src="${column.cover}" class="column-logo" alt=""><span th:unless="${column.cover != null and !column.cover.isEmpty()}" class="column-logo fallback"><i class="folder outline icon"></i></span><span class="column-name" th:title="${column.name}" th:text="${column.name}">专栏</span><span class="count" th:text="${column.blogCount + '篇'}">0篇</span></a><div class="children" th:if="${!column.children.isEmpty()}"><a class="column-row child-row" th:each="child : ${column.children}" th:href="@{'/column/' + ${child.id}}"><span class="child-branch" aria-hidden="true"></span><img th:if="${child.cover != null and !child.cover.isEmpty()}" th:src="${child.cover}" class="column-logo child-logo" alt=""><span th:unless="${child.cover != null and !child.cover.isEmpty()}" class="column-logo child-logo fallback"><i class="folder outline icon"></i></span><span class="column-name" th:title="${child.name}" th:text="${child.name}">子专栏</span><span class="count" th:text="${child.blogCount + '篇'}">0篇</span></a></div></div></div></div></div>
		<div class="ui segments m-box custom-module article-custom-module-sticky" th:if="${layout.siteInfo['customModule'] != null and layout.siteInfo['customModule'].enabled}"><div class="ui secondary segment" th:if="${layout.siteInfo['customModule'].title != null}"><i class="puzzle piece icon"></i><span th:text="${layout.siteInfo['customModule'].title}"></span></div><div class="ui segment custom-module-body" th:utext="${layout.siteInfo['customModule'].content}"></div></div>
	</aside>
	<section class="ten wide column"><div class="article-page is-ready"><article class="ui padded attached segment m-padded-tb-large article-card">
		<header class="article-header">
			<h1 class="article-title" th:text="${article.title}">文章标题</h1>
			<p class="article-meta">
				<a class="article-category" th:if="${article.category != null}" th:href="@{'/category/' + ${article.category.name}}"><i class="small folder open icon"></i><span th:text="${article.category.name}"></span></a>
				<span class="meta-item m-datetime"><i class="small calendar outline icon"></i><time th:datetime="${seo.publishedTime}" th:text="${#dates.format(article.createTime, 'yyyy-MM-dd')}"></time></span>
				<span class="meta-item m-views" th:if="${article.views != null}"><i class="small eye outline icon"></i><span th:text="${article.views + ' 次阅读'}"></span></span>
				<span class="meta-item" th:if="${article.words != null}"><i class="small pencil alternate icon"></i><span th:text="${article.words + ' 字'}"></span></span>
				<span class="meta-item" th:if="${article.readTime != null}"><i class="small clock outline icon"></i><span th:text="${'约 ' + article.readTime + ' 分钟'}"></span></span>
			</p>
		</header>
		<div class="typo js-toc-content match-braces rainbow-braces article-content" th:utext="${article.content}">正文</div>
		<div class="article-footer"><div class="article-tags" th:if="${article.tags != null and !article.tags.isEmpty()}"><a class="article-tag" th:each="tag : ${article.tags}" th:href="@{'/tag/' + ${tag.name}}"><i class="tag icon"></i><span th:text="${tag.name}"></span></a></div></div>
	</article>
	<div class="ui attached positive message article-license"><ul class="list"><li th:text="${'作者：' + (layout.introduction.name ?: seo.siteName)}"></li><li th:text="${'发表时间：' + #dates.format(article.createTime, 'yyyy-MM-dd HH:mm')}"></li><li th:if="${article.updateTime != null}" th:text="${'最后修改：' + #dates.format(article.updateTime, 'yyyy-MM-dd HH:mm')}"></li><li>本站点采用<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank"> 署名 4.0 国际 (CC BY 4.0) </a>创作共享协议。</li></ul></div>
	<div class="ui bottom teal attached segment threaded comments article-comments"><h3 class="ui header">评论区请在客户端页面查看</h3></div></div></section>
	<aside class="three wide column m-mobile-hide article-toc-column" aria-label="文章辅助导航">
		<div class="ui segments m-toc toc-wrapper m-box"><div class="ui secondary segment toc-header"><div class="toc-title"><i class="list ul icon"></i>本文目录</div><button type="button" class="toc-toggle" aria-expanded="true" title="收拢目录"><i class="angle up icon"></i></button></div><div class="ui yellow segment toc-content"><div class="js-toc"></div></div></div>
	</aside>
</div></div></div></main>
<footer class="site-footer"><div class="footer-container">
	<div class="footer-main"><div class="footer-col footer-about"><h4 class="footer-title" th:text="${layout.siteInfo['blogName'] ?: seo.siteName}">BlogLoom</h4><p class="footer-desc">记录技术成长与生活思考，分享原创文章与开源项目。</p><p class="footer-motto" th:if="${!layout.introduction.rollText.isEmpty()}" th:text="${'“' + layout.introduction.rollText[0] + '”'}"></p><div class="footer-social"><a class="social-link" th:if="${layout.introduction.github != null}" th:href="${layout.introduction.github}">GitHub</a><a class="social-link" th:if="${layout.introduction.bilibili != null}" th:href="${layout.introduction.bilibili}">bilibili</a><a class="social-link" th:if="${layout.introduction.telegram != null}" th:href="${layout.introduction.telegram}">Telegram</a><a class="social-link" th:if="${layout.introduction.email != null}" th:href="${layout.introduction.email}">邮箱</a></div></div><div class="footer-col"><h4 class="footer-title">最新博客</h4><ul class="footer-list"><li th:each="item : ${layout.newBlogs}"><a th:href="@{'/blog/' + ${item.id}}" th:text="${item.title}"></a></li><li class="footer-empty" th:if="${layout.newBlogs.isEmpty()}">暂无文章</li></ul></div><div class="footer-col"><h4 class="footer-title">快捷链接</h4><ul class="footer-list"><li><a href="/home">首页</a></li><li><a href="/archives">归档</a></li><li><a href="/moments">动态</a></li><li><a href="/friends">友人帐</a></li><li><a href="/about">关于我</a></li></ul></div></div>
	<div class="footer-divider"></div><div class="footer-bottom"><p class="footer-copyright"><th:block th:if="${layout.siteInfo['copyright'] != null}"><span class="footer-copyright-title" th:text="${layout.siteInfo['copyright'].title}"></span><a class="footer-link" th:href="${layout.siteInfo['copyright'].siteUrl ?: '/'}" th:text="${layout.siteInfo['copyright'].siteName}"></a><span class="footer-sep" th:if="${layout.siteInfo['beian'] != null}">|</span></th:block><a class="footer-link" th:if="${layout.siteInfo['beian'] != null}" href="https://beian.miit.gov.cn/" rel="external nofollow noopener" th:text="${layout.siteInfo['beian']}"></a></p><div class="footer-badges"><div class="github-badge" th:each="badge : ${layout.badges}"><a th:href="${badge.url}" rel="external nofollow noopener" th:title="${badge.title}"><span class="badge-subject" th:text="${badge.subject}"></span><span class="badge-value" th:classappend="${'bg-' + badge.color}" th:text="${badge.value}"></span></a></div></div></div>
</div>
</footer>
</div>

<script defer src="/lib/js/prism.js" data-manual></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/tocbot/4.6.0/tocbot.min.js"></script>
<script>document.addEventListener('DOMContentLoaded',function(){if(window.tocbot)tocbot.init({tocSelector:'.js-toc',contentSelector:'.js-toc-content',headingSelector:'h1,h2,h3,h4',collapseDepth:6,positionFixedSelector:'.m-toc',scrollSmooth:true,scrollSmoothDuration:420,scrollSmoothOffset:-78,headingsOffset:-18});var b=document.querySelector('.toc-toggle'),p=document.querySelector('.toc-content');if(b&&p)b.addEventListener('click',function(){var c=p.classList.toggle('is-panel-collapsed');b.classList.toggle('is-collapsed',c);b.setAttribute('aria-expanded',String(!c));b.title=c?'展开目录':'收拢目录'});if(window.Prism)Prism.highlightAll()})</script>
</body>
</html>
